name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # тесты не ходят в сеть, но конфигу нужен ключ подписи
  SECRET_KEY: ci-secret-key-not-used-in-production
  DATABASE_URL: sqlite+aiosqlite:///./data/ci.db

jobs:
  lint:
    name: Линтеры и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy app

  test:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

  migrations:
    name: Миграции
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anime
          POSTGRES_PASSWORD: anime
          POSTGRES_DB: anime
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anime"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"

      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://anime:anime@localhost:5432/anime
        run: alembic upgrade head

      - name: Проверка, что модели совпадают со схемой
        env:
          DATABASE_URL: postgresql+asyncpg://anime:anime@localhost:5432/anime
        run: alembic check

  docker:
    name: Сборка образа
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: anime-watch-together:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Проверка живости контейнера
        run: |
          docker run -d --name awt \
            -e SECRET_KEY=ci-secret-key \
            -e BASE_URL=http://localhost:8000 \
            -p 8000:8000 anime-watch-together:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              echo "healthcheck OK"; exit 0
            fi
            sleep 2
          done
          echo "Контейнер не поднялся:"; docker logs awt; exit 1
