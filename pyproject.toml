[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anime-watch-together"
version = "1.0.0"
description = "Watch anime together in sync: rooms with a shared player, Discord guild auth and episode tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ialakey" }]
keywords = [
    "anime",
    "watch-together",
    "watch-party",
    "synchronized-playback",
    "fastapi",
    "websocket",
    "discord-oauth2",
    "hls",
    "video-streaming",
    "anime-tracker",
    "self-hosted",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Natural Language :: Russian",
    "Natural Language :: English",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "anime-dl-core[async]>=0.5.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
socks = ["anime-dl-core[socks]>=0.5.0", "httpx[socks]>=0.27"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/ialakey/anime-watch-together"
Source = "https://github.com/ialakey/anime-watch-together"
Issues = "https://github.com/ialakey/anime-watch-together/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = "^(alembic|tests)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
